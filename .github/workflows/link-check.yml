name: Video Link Check

on:
  schedule:
    - cron: "0 6 */3 * *"      # Her 3 gunde bir 06:00 UTC
  workflow_dispatch:            # Elle tetikleme

# Repoya yazabilmek icin
permissions:
  contents: write

# Ayni anda iki tane calismasin (cron + manuel)
concurrency:
  group: link-check
  cancel-in-progress: false

env:
  MANIFEST_URL: "https://cdn.jsdelivr.net/gh/playtoon1/content-json@main/series_manifest.json"
  JSON_OUT:     "link_status.json"

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bagimliliklari yukle
        run: pip install aiohttp

      - name: Link kontrolu + JSON rapor
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO:   ${{ secrets.MAIL_TO }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_SUBJECT_PREFIX: "[Otomatik] "
        run: |
          python check_links_cli.py \
            --manifest "$MANIFEST_URL" \
            --json-out "$JSON_OUT"

      - name: JSON raporu repoya commit'le
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "$JSON_OUT"

          # Degisiklik yoksa cik
          if git diff --cached --quiet; then
            echo "[=] JSON degismedi, commit yok."
            exit 0
          fi

          git commit -m "chore: link status $(date -u +%Y-%m-%d_%H:%M) [skip ci]"

          # Cron ayni anda baska bir push yaptiysa rebase ile hallet
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Raporu artifact olarak yukle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: link-report-${{ github.run_number }}
          path: |
            report.html
            report.csv
            summary.txt
            link_status.json
          retention-days: 30
